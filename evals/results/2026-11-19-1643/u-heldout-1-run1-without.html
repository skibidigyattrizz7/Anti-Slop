<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale:1.0">
<title>Rosa's Tailoring</title>
<style>
  :root {
    --ink: #2b2420;
    --muted: #6b5d55;
    --paper: #fbf7f2;
    --accent: #9a4a3c;
    --line: #e4d9cf;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.6;
  }
  header {
    text-align: center;
    padding: 3rem 1.5rem 2rem;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: normal;
    letter-spacing: 0.02em;
  }
  header p {
    margin: 0.5rem 0 0;
    color: var(--muted);
    font-style: italic;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
  }
  section {
    margin-bottom: 2.5rem;
  }
  h2 {
    font-size: 1.4rem;
    font-weight: normal;
    color: var(--accent);
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.4rem;
    margin: 0 0 1rem;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  td {
    padding: 0.8rem 0;
    border-bottom: 1px dotted var(--line);
    vertical-align: top;
  }
  td.price {
    text-align: right;
    white-space: nowrap;
    font-weight: bold;
    width: 6rem;
  }
  td small {
    display: block;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1.5rem;
  }
  .info-grid h3 {
    margin: 0 0 0.3rem;
    font-size: 1rem;
    font-weight: bold;
  }
  .info-grid p {
    margin: 0;
    color: var(--muted);
  }
  a {
    color: var(--accent);
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    border-top: 1px solid var(--line);
    padding: 1.5rem;
  }
</style>
</head>
<body>

<header>
  <h1>Rosa's Tailoring</h1>
  <p>Alterations and repairs</p>
</header>

<main>

  <section>
    <h2>Services &amp; Prices</h2>
    <table>
      <tr>
        <td>Hemming</td>
        <td class="price">$12</td>
      </tr>
      <tr>
        <td>Zip replacement</td>
        <td class="price">$18</td>
      </tr>
    </table>
  </section>

  <section>
    <h2>Visit Us</h2>
    <div class="info-grid">
      <div>
        <h3>Hours</h3>
        <p>Monday to Friday<br>10:00 AM to 6:00 PM</p>
      </div>
      <div>
        <h3>Address</h3>
        <p>22 Mill Lane</p>
      </div>
      <div>
        <h3>Phone</h3>
        <p><a href="tel:+15550199">555-0199</a></p>
      </div>
    </div>
  </section>

</main>

<footer>
  &copy; Rosa's Tailoring &middot; 22 Mill Lane &middot; 555-0199
</footer>

</body>
</html>
