<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosa's Tailoring</title>
<style>
  :root {
    --ink: #2b2118;
    --muted: #6b5a4a;
    --paper: #fbf7f1;
    --accent: #8a4b2a;
    --line: #e4d8c8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.6;
  }
  header, main, footer {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 24px;
  }
  header {
    padding-top: 64px;
    text-align: center;
  }
  h1 {
    font-size: 2.8rem;
    margin: 0 0 8px;
    letter-spacing: 0.02em;
  }
  .tagline {
    color: var(--muted);
    font-style: italic;
    margin: 0;
  }
  h2 {
    font-size: 1.5rem;
    color: var(--accent);
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
    margin-top: 48px;
  }
  .services {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .services li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 14px 0;
    border-bottom: 1px dotted var(--line);
  }
  .services .name { font-weight: bold; }
  .services .price {
    font-size: 1.15rem;
    color: var(--accent);
    white-space: nowrap;
    margin-left: 16px;
  }
  .details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-top: 16px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 20px;
  }
  .card h3 {
    margin: 0 0 8px;
    font-size: 1.05rem;
    color: var(--accent);
  }
  .card p { margin: 0; }
  a {
    color: var(--accent);
    text-decoration: none;
  }
  a:hover { text-decoration: underline; }
  footer {
    margin-top: 56px;
    padding-bottom: 48px;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    border-top: 1px solid var(--line);
    padding-top: 24px;
  }
  @media (max-width: 560px) {
    h1 { font-size: 2.2rem; }
    .details { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>Rosa's Tailoring</h1>
  <p class="tagline">Careful alterations and repairs</p>
</header>

<main>
  <h2>Services &amp; Prices</h2>
  <ul class="services">
    <li>
      <span class="name">Hemming</span>
      <span class="price">$12</span>
    </li>
    <li>
      <span class="name">Zip Replacement</span>
      <span class="price">$18</span>
    </li>
  </ul>

  <h2>Visit Us</h2>
  <div class="details">
    <div class="card">
      <h3>Hours</h3>
      <p>Monday to Friday<br>10:00 AM to 6:00 PM</p>
    </div>
    <div class="card">
      <h3>Location</h3>
      <p>22 Mill Lane</p>
    </div>
    <div class="card">
      <h3>Phone</h3>
      <p><a href="tel:+15550199">555-0199</a></p>
    </div>
  </div>
</main>

<footer>
  <p>Rosa's Tailoring &middot; 22 Mill Lane &middot; 555-0199</p>
</footer>

</body>
</html>
